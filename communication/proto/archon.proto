syntax = "proto3";

package archon;

service ArchonCoordinator {

    rpc RegisterNode (NodeRegistration)
        returns (NodeRegistrationResponse);

    rpc Heartbeat (HeartbeatRequest)
        returns (HeartbeatResponse);

    rpc GetZoneStatus (ZoneRequest)
        returns (ZoneStatus);
}

message NodeRegistration {
    string node_id = 1;
    string host = 2;
    int32 port = 3;
}

message NodeRegistrationResponse {
    bool success = 1;
    string message = 2;
}

message HeartbeatRequest {
    string node_id = 1;
}

message HeartbeatResponse {
    bool acknowledged = 1;
    string message = 2;
}

message ZoneRequest {
    string node_id = 1;
}

message ZoneStatus {
    string node_id = 1;
    string status = 2;
    string message = 3;
}
